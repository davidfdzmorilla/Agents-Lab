name: agentlab

services:
  db:
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentlab -d agentlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # enabled by TASK-007, which adds docker/web.Dockerfile
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend, egress]
    # TASK-005 adds a one-shot "migrate" service; web and worker will depend on it
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env (cp .env.example .env)}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    init: true
    # Must stay above SHUTDOWN_GRACE_MS (30000 ms) plus margin.
    stop_grace_period: 40s
    networks: [backend, egress]
    # TASK-005 adds a one-shot "migrate" service; web and worker will depend on it
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env (cp .env.example .env)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-}
      WORKER_STALE_MS: ${WORKER_STALE_MS:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      AGENTLAB_PROVIDER: ${AGENTLAB_PROVIDER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  ollama:
    profiles: ["local"]
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    volumes:
      - ollama:/root/.ollama
    networks: [backend, egress]

networks:
  backend:
    internal: true
  egress: {}

volumes:
  pgdata:
  ollama:
