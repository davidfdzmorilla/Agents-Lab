name: agentlab

services:
  db:
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend, test-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentlab -d agentlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: migrate
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env (cp .env.example .env)}

  # Exits with 143 on SIGTERM by design of Next (ADR-012); the only service that does not exit 0. Not a failure.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    # Next writes its image cache here; keeps /app non-writable in the image (ADR-012).
    tmpfs:
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env (cp .env.example .env)}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: runtime
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    # Must stay above SHUTDOWN_GRACE_MS (30000 ms) plus the 5 s shutdown margin.
    stop_grace_period: 40s
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env (cp .env.example .env)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-}
      WORKER_STALE_MS: ${WORKER_STALE_MS:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      AGENTLAB_PROVIDER: ${AGENTLAB_PROVIDER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  # Run by make test / make validate only. Reaches db through the internal test-db network (no internet, no other services).
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: test
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [test-db]
    depends_on:
      db:
        condition: service_healthy
    working_dir: /work
    environment:
      # DATABASE_URL_TEST cannot use :? here: compose interpolates every service, so it would break make up.
      # The Makefile checks it inside the container instead.
      DATABASE_URL_TEST: ${DATABASE_URL_TEST:-}
      npm_config_store_dir: /pnpm-store
      COREPACK_ENABLE_NETWORK: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    volumes:
      - pnpm-store:/pnpm-store:ro

  ollama:
    profiles: ["local"]
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    volumes:
      - ollama:/root/.ollama
    networks: [backend, egress]

networks:
  backend:
    internal: true
  test-db:
    internal: true
  egress: {}

volumes:
  pgdata:
  ollama:
  # Created by make test / make validate (TASK-003); shared with the node container of the install phase.
  pnpm-store:
    external: true
    name: agentlab-pnpm-store
